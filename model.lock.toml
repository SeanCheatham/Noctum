# Local model Noctum runs itself. There is no endpoint list.
#
# Qwen2.5-Coder-7B-Instruct, GGUF quant Q5_K_M, from the official Qwen repo.
# The overnight daemon was developed against the qwen2.5-coder family. This
# is still the maintained 7B-class instruct GGUF, so it is pinned directly
# rather than replaced by a larger model. Q5_K_M is the published quant above
# Q4 (about 5.1 GiB) that fits a 16 GB machine while the guest is stopped.
#
# llama.cpp tag b12528 ships a Linux x86_64 CPU build of llama-server that
# loads this GGUF. The archive hash was computed from the upstream tarball.
# The GGUF hash is the Hugging Face LFS oid of
# qwen2.5-coder-7b-instruct-q5_k_m.gguf.
#
# This pin stays on the 7B Q5_K_M file. The ignored test behind
# qemu/real-pass.sh can point NOCTUM_GGUF at a smaller coder GGUF when the
# machine cannot hold this file. That override is not a second production model.

llama_cpp_tag = "b12528"
