name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-release:
    name: macOS ARM64
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the host tools
        run: |
          sh scripts/build-host.sh release
          cargo build --release --locked --bin noctum
          strip -x target/release/noctum
          codesign --force --sign - target/release/noctum
          codesign --verify --strict target/release/noctum-host
      - name: Create the archive
        run: |
          cd target/release
          tar czf noctum-aarch64-apple-darwin.tar.gz noctum noctum-host
          shasum -a 256 noctum-aarch64-apple-darwin.tar.gz > noctum-aarch64-apple-darwin.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: noctum-macos-arm64
          path: |
            target/release/noctum-aarch64-apple-darwin.tar.gz
            target/release/noctum-aarch64-apple-darwin.tar.gz.sha256
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/noctum-aarch64-apple-darwin.tar.gz
            target/release/noctum-aarch64-apple-darwin.tar.gz.sha256
          generate_release_notes: true
