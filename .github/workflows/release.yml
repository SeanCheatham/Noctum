name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/noctum

      - name: Create archive
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf noctum-x86_64-unknown-linux-gnu.tar.gz noctum
          sha256sum noctum-x86_64-unknown-linux-gnu.tar.gz > noctum-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctum-x86_64-unknown-linux-gnu
          path: |
            target/x86_64-unknown-linux-gnu/release/noctum-x86_64-unknown-linux-gnu.tar.gz
            target/x86_64-unknown-linux-gnu/release/noctum-x86_64-unknown-linux-gnu.tar.gz.sha256

  qemu-bundle:
    name: Build QEMU bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 ninja-build meson \
            flex bison bc cpio libelf-dev libssl-dev \
            libglib2.0-dev libpixman-1-dev libattr1-dev

      - name: Build the measurement bundle
        run: sh qemu/build-bundle.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: noctum-qemu-bundle
          path: qemu/out/*.tar.gz

  create-release:
    name: Create Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the binary
        uses: actions/download-artifact@v4
        with:
          name: noctum-x86_64-unknown-linux-gnu
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
