# Noctum Docker Compose Configuration
# Sandboxed simulation testing environment

services:
  noctum:
    build:
      context: ..
      dockerfile: noctum/Dockerfile
    container_name: noctum-sandbox
    ports:
      - "3000:3000"
    volumes:
      # Mount the project directory for simulation testing
      - ../:/project:ro
    environment:
      - NODE_ENV=production
    networks:
      - sandbox
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  sandbox:
    internal: true
