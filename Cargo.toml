[workspace]
members = [".", "crates/noctum-fence"]
resolver = "2"

[package]
name = "noctum"
version = "0.2.0"
edition = "2021"
description = "A local overnight daemon that keeps a Rust change when a test gets cheaper"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SeanCheatham/Noctum"
readme = "README.md"
default-run = "noctum"
keywords = ["performance", "rust", "qemu", "llama", "benchmark"]
categories = ["development-tools", "command-line-utilities"]
authors = ["Sean Cheatham"]

[features]
worker = []

[[bin]]
name = "noctum-worker"
path = "src/bin/noctum-worker.rs"
required-features = ["worker"]

[dependencies]
addr2line = "0.24"
anyhow = "1"
askama = "0.12"
axum = { version = "0.7", features = ["macros", "form"] }
chrono = "0.4.42"
clap = { version = "4", features = ["derive"] }
directories = "5"
flate2 = "1"
futures-util = "0.3"
glob = "0.3"
glob-match = "0.2"
mime_guess = "2"
object = "0.36"
proc-macro2 = { version = "1", features = ["span-locations"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
