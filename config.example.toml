# Copy to ~/.config/noctum/config.toml, or pass --config.
# Unknown keys are an error. Model files and the QEMU bundle are pinned.
# Optional. Defaults to the platform data directory.
# data_dir = "/var/lib/noctum"

[general]
log_level = "info"
author_name = "Noctum"
author_email = "noctum@localhost"

[web]
port = 8420
# The dashboard checks the Host header and only answers on this bind address.
host = "127.0.0.1"

[schedule]
start_hour = 22
end_hour = 6
check_interval_seconds = 60

[gate]
min_improvement_ratio = 0.01
min_insn_delta = 10000
max_candidates = 3
max_tests = 3
max_scan = 20
measure_repeats = 2

[guest]
memory_mb = 1024

[model]
# Q2 is the default for 16 GB machines. Q4 needs more memory and disk space.
quant = "q2"

[optimization]
# Use sweep to include all functions mapped by the measured workloads.
selection = "hot"
# Memory and balanced goals enable the measurement allocator.
goal = "cpu"
memory_metric = "allocated_bytes"
min_memory_delta = 1
min_memory_ratio = 0.01
# Memory and balanced goals check all three resource limits.
max_cpu_increase_ratio = 0.0
max_memory_increase_ratio = 0.0
