# Copy to ~/.config/noctum/config.toml, or pass --config.
# Unknown keys are an error. The model and the QEMU bundle are lockfiles,
# not fields in this file.

[general]
log_level = "info"
author_name = "Noctum"
author_email = "noctum@localhost"

[web]
port = 8420
# The dashboard checks the Host header and only answers on this bind address.
host = "127.0.0.1"

[schedule]
start_hour = 22
end_hour = 6
check_interval_seconds = 60

[gate]
min_improvement_ratio = 0.01
min_insn_delta = 10000
max_candidates = 3
max_tests = 3
max_scan = 20
measure_repeats = 2

[guest]
memory_mb = 1024

# Optional. Defaults to the platform data directory.
# data_dir = "/var/lib/noctum"
