{% extends "base.html" %}
{% block title %}Settings - Noctum{% endblock %}
{% block content %}
<h1>Settings</h1>
{% if saved %}<p>Saved.</p>{% endif %}
<form method="post" action="/settings" class="card" style="display: grid; gap: 0.75rem; max-width: 36rem;">
    <label>Window start hour <input name="start_hour" type="number" min="0" max="23" value="{{ start_hour }}" /></label>
    <label>Window end hour <input name="end_hour" type="number" min="0" max="23" value="{{ end_hour }}" /></label>
    <label>Wake interval (seconds) <input name="check_interval_seconds" type="number" min="1" value="{{ check_interval_seconds }}" /></label>
    <label>Minimum improvement ratio <input name="min_improvement_ratio" type="text" value="{{ min_improvement_ratio }}" /></label>
    <label>Minimum instruction delta <input name="min_insn_delta" type="number" min="1" value="{{ min_insn_delta }}" /></label>
    <label>Max candidates <input name="max_candidates" type="number" min="1" value="{{ max_candidates }}" /></label>
    <label>Max tests <input name="max_tests" type="number" min="1" value="{{ max_tests }}" /></label>
    <label>Max scan <input name="max_scan" type="number" min="1" value="{{ max_scan }}" /></label>
    <label>Web host <input name="host" type="text" value="{{ host }}" /></label>
    <label>Web port <input name="port" type="number" min="1" value="{{ port }}" /></label>
    <button class="btn" type="submit">Save</button>
</form>
<div class="card">
    <h3>Components</h3>
    <p>Model {{ model_lock }}</p>
    <p>Measurement {{ qemu_lock }}</p>
</div>
{% endblock %}
