version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noctum
      POSTGRES_PASSWORD: noctum
      POSTGRES_DB: noctum
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noctum -d noctum"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sandbox

  server:
    build:
      context: ..
      dockerfile: noctum/Dockerfile.server
    environment:
      DATABASE_URL: postgres://noctum:noctum@postgres:5432/noctum
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sandbox

  client:
    build:
      context: ..
      dockerfile: noctum/Dockerfile.client
    environment:
      SERVER_URL: http://server:3000
      COOLDOWN_MS: "2000"
      MAX_ITERATIONS: "5"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - sandbox

networks:
  sandbox:
    internal: true

volumes:
  postgres_data:
